# Scrape GMP de kube-state-metrics (port http:8080).
# Alimente l'alerte Cloud Monitoring #6 (kube_cronjob_next_schedule_time)
# définie dans gke_project/monitoring.tf.
apiVersion: monitoring.googleapis.com/v1
kind: PodMonitoring
metadata:
  name: kube-state-metrics
  namespace: monitoring
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-state-metrics
  endpoints:
    - port: http
      path: /metrics
      # 60s suffit : l'alerte cronjob_missed_schedule évalue à 60s. 30s doublait
      # le volume de samples ingérés (facturés) pour rien.
      interval: 60s
      metricRelabeling:
        # Réduction coût GMP : ne garder que les métriques réellement utilisées.
        # kube_cronjob_* alimente l'alerte #6 (cronjob_missed_schedule) ; kube_job_*
        # donne la visibilité sur les jobs ELT. On élimine le gros du volume :
        # kube_pod_* / kube_node_* / kube_*_labels à très forte cardinalité.
        - sourceLabels: [__name__]
          regex: kube_cronjob_.*|kube_job_.*
          action: keep
